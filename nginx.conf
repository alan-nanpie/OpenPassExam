server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮優化
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # 根路徑與 SPA 入口 (HTML, Bootstrap JS, Service Worker) 絕不長效快取，保證發布後使用者立即獲取最新版本
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # 處理 Flutter Web 的客戶端路由 (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 快取靜態資源 (WASM, 字型, 圖檔, CSS 等靜態資源)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
