server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮優化
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    # 處理 Flutter Web 的客戶端路由 (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 快取靜態資源 (JS, CSS, WASM, 字型, 圖檔)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
